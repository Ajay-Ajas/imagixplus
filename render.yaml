# Render Blueprint: one web service (API + website) and one PostgreSQL database.
# Deploys separately from civicmindai.in and does not touch it.
services:
  - type: web
    name: imagixplus
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://imagix.civicmindai.in
      - key: DATABASE_URL
        fromDatabase:
          name: imagixplus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: PGSSL
        value: "false"
      - key: CONTACT_TO
        value: contact@civicmindai.in
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: imagixplus-db
    databaseName: imagixplus
    plan: free   # Free databases expire. Upgrade to a paid plan before relying on this for real content.
